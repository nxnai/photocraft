[package]
name = "photocraft-compose"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-vector = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
photocraft-paint = { workspace = true }

[[bench]]
name = "compose"
harness = false

# Parallel paths run on native and on wasm built with +atomics (the page starts a thread pool); plain wasm stays single-threaded.
[target.'cfg(any(not(target_arch = "wasm32"), target_feature = "atomics"))'.dependencies]
rayon = { workspace = true }
