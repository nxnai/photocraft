[package]
name = "photocraft-vector"
description = "Vector paths, shape layers, strokes and vector masks → anti-aliased coverage and surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-doc = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

# Parallel paths run on native and on wasm built with +atomics (the page starts a thread pool); plain wasm stays single-threaded.
[target.'cfg(any(not(target_arch = "wasm32"), target_feature = "atomics"))'.dependencies]
rayon = { workspace = true }
