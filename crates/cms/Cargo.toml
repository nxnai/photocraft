[package]
name = "photocraft-cms"
description = "Pure-Rust ICC v2/v4 colour management: profile parsing and writing, transforms, rendering intents, black point compensation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[dev-dependencies]
moxcms = "0.8"

# Parallel paths run on native and on wasm built with +atomics (the page starts a thread pool); plain wasm stays single-threaded.
[target.'cfg(any(not(target_arch = "wasm32"), target_feature = "atomics"))'.dependencies]
rayon = { workspace = true }
